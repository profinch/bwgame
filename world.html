<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ground State — engine</title>
  </head>
  <body class="world">
    <canvas id="view"></canvas>
    <header class="hud">
      <h1><span class="mark"></span>ground state</h1>
      <p class="hint">engine prototype — the world is dark until you stand in it</p>
    </header>
    <footer class="hud bottom">
      <p class="place"></p>
      <p class="stat"></p>
      <form class="go">
        <input name="where" placeholder="0x… or a name.eth — go there" spellcheck="false" autocomplete="off" />
      </form>
    </footer>
    <aside class="hud claim" hidden>
      <p class="claim-said">this ground is unclaimed</p>
      <p class="claim-count"></p>
      <p class="claim-earlier" hidden></p>
      <label class="claim-cores">
        <input type="range" class="cores" min="1" step="1" />
        <span class="cores-said"></span>
      </label>
      <p class="claim-do">
        <button type="button" class="dig">dig here</button>
        <button type="button" class="take" hidden>claim it</button>
      </p>
    </aside>
    <aside class="hud own" hidden>
      <p class="own-said"></p>
      <p class="own-note"></p>
      <form class="own-write">
        <input name="note" placeholder="write into it" spellcheck="false" autocomplete="off" maxlength="200" />
        <button type="submit">inscribe</button>
      </form>
      <form class="own-code">
        <input name="code" placeholder="0x… a contract of yours" spellcheck="false" autocomplete="off" />
        <button type="submit">point at code</button>
      </form>
      <form class="own-name" hidden>
        <input name="label" placeholder="a name under groundstate.eth" spellcheck="false" autocomplete="off" maxlength="32" />
        <button type="submit">name it</button>
      </form>
      <p class="own-do">
        <button type="button" class="seal">seal the code for good</button>
      </p>
    </aside>
    <div class="touchpad" aria-label="walk"><div class="knob"></div></div>
    <div class="touchpad-buttons">
      <button type="button" class="jump" aria-label="jump">jump</button>
      <button type="button" class="view" aria-label="change view">view</button>
    </div>
    <script type="module" src="/src/world.ts"></script>
  </body>
</html>
