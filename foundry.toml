[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["contracts/lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "@ensdomains/contracts-v2/=contracts/lib/contracts-v2/contracts/src/",
  "@ensdomains/verifiable-factory/=contracts/lib/contracts-v2/contracts/lib/verifiable-factory/src/",
  "@openzeppelin/contracts/=contracts/lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=contracts/lib/contracts-v2/contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@ens/contracts/=contracts/lib/contracts-v2/contracts/lib/ens-contracts/contracts/",
  "solady/=contracts/lib/contracts-v2/contracts/lib/solady/src/",
  "forge-std/=contracts/lib/forge-std/src/",
]
