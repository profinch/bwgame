specVersion: 1.2.0
description: Ground State — every plot the factory has made, who holds it, and what is written into it
repository: https://github.com/profinch/bwgame
schema:
  file: ./schema.graphql
dataSources:
  # The factory: the one contract that ever deploys a plot, and the one that
  # says what it has made.
  - kind: ethereum
    name: Plots
    network: sepolia
    source:
      address: "0xcEa322619d375B381bff95e53a02Ef92Ea81B5Df"
      abi: Plots
      startBlock: 11674690
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Plot
        - Owner
      abis:
        - name: Plots
          file: ./abis/Plots.json
        - name: Plot
          file: ./abis/Plot.json
      eventHandlers:
        - event: Claimed(indexed address,indexed address,bytes32)
          handler: handleClaimed
      file: ./src/plots.ts
  # Names: what plots are called under groundstate.eth (ENSv2 on Sepolia).
  - kind: ethereum
    name: Names
    network: sepolia
    source:
      address: "0x2E32A8CE61f46c7276Bc3786e0a7AE32da2E29ED"
      abi: Names
      startBlock: 11675060
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Plot
      abis:
        - name: Names
          file: ./abis/Names.json
      eventHandlers:
        - event: Named(indexed address,string)
          handler: handleNamed
        - event: Unnamed(indexed address,string)
          handler: handleUnnamed
      file: ./src/names.ts
templates:
  # Every plot is its own contract, brought into being by a claim; from then on
  # it is listened to for what is written into it and whose it becomes.
  - kind: ethereum
    name: Plot
    network: sepolia
    source:
      abi: Plot
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Plot
        - Owner
        - Inscription
        - Transfer
      abis:
        - name: Plot
          file: ./abis/Plot.json
      eventHandlers:
        - event: Inscribed(string)
          handler: handleInscribed
        - event: Transferred(indexed address,indexed address)
          handler: handleTransferred
        - event: CodeSet(indexed address)
          handler: handleCodeSet
        - event: SealedForGood()
          handler: handleSealed
      file: ./src/plot.ts
