# gs.bwtoken.io — Ground State: static build of the map.
# Goes in /data/docker/containers/nginx/conf/io-bwtoken-gs.conf, then reload nginx.
# TLS: the wildcard *.bwtoken.io certificate (certbot DNS-01) already covers this host.

server {
  listen 80;
  server_name gs.bwtoken.io;
  access_log off;
  error_log off;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name gs.bwtoken.io;
  http2 on;

  root /data/www/io/gs;
  index index.html;

  access_log /var/log/nginx/io/bwtoken-gs-access.log;
  error_log /var/log/nginx/io/bwtoken-gs-error.log;

  ssl_certificate /etc/letsencrypt/live/bwtoken.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bwtoken.io/privkey.pem;

  # Cloudflare-only: the origin must not answer requests that skipped the edge.
  # $bkl_from_cf is defined in conf/00-cloudflare-geo.conf and tests the peer
  # address, not the rewritten $remote_addr.
  if ($bkl_from_cf = 0) {
    return 403;
  }
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # A place is a link: every route is the same page, the fragment picks the spot.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build file names carry a hash, so they can be cached for good.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
